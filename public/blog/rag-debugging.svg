<rect x="72" y="340" width="316" height="168" rx="16" fill="#181716" stroke="#5d534a"/>
<text x="96" y="382" font-size="17" fill="#dfad8e">01 / EXTRACTION</text>
<text x="96" y="430" font-size="26" fill="#f1eee8">Is the text correct?</text>
<text x="96" y="470" font-size="19" fill="#aaa69e">Source → Stored chunks</text>
<rect x="442" y="340" width="316" height="168" rx="16" fill="#181716" stroke="#5d534a"/>
